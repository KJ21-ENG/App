name: Fork standalone iOS QA
run-name: "standalone-ios-qa: ${{ inputs.source_sha }}"

# Builds a self-contained ReleaseDevelopment iOS Simulator app (JS bundle embedded, no Metro)
# from an exact KJ21-ENG/App commit, for local simulator QA. Fork-only tooling; never part of a PR.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact existing KJ21-ENG/App commit to build
        required: true
        type: string
      xcode_version:
        description: Xcode version override (default is the version pinned by the source's getXcodeVersion action)
        required: false
        default: ""
        type: string
      build_app:
        description: Build the Release simulator app
        required: false
        default: true
        type: boolean
      build_unminified_js:
        description: Also build an unminified iOS JS bundle to swap into the app when the minified bundle cannot be debugged
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ios:
    if: inputs.build_app
    runs-on: macos-26
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      XCODE_VERSION: ${{ inputs.xcode_version }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      NODE_OPTIONS: --max-old-space-size=6144
      # Same bundler lane as the standalone Android QA build.
      BUNDLER: metro
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: KJ21-ENG/App
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION=$(node -p 'require("./package.json").engines.npm')
          npm exec --yes --package="npm@$NPM_VERSION" -- npm ci --no-audit --no-fund --no-update-notifier
      # macOS runners ship an older Ruby than the Gemfile requires; same pinned action as buildIOS.yml.
      - name: Setup Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
        with:
          bundler-cache: true
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          # Use the same Xcode as upstream iOS CI; older Xcodes fail to compile current native dependencies.
          if [ -z "$XCODE_VERSION" ]; then
            XCODE_VERSION=$(sed -n 's/^ *VERSION="\([0-9.]*\)"$/\1/p' .github/actions/composite/getXcodeVersion/action.yml)
          fi
          requested="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$requested" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner"
            ls -d /Applications/Xcode_* || true
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s\n' "$requested" >> "$GITHUB_ENV"
      - name: Configure contributor build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          # Public contributor defaults only; no personal .env or account data.
          printf 'ENVIRONMENT=development\nUSE_WEB_PROXY=false\n' > .env
      - name: Build Release simulator app
        run: npx rock build:ios --configuration ReleaseDevelopment --scheme 'New Expensify Dev' --destination simulator --verbose
      - name: Stage app and provenance
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" ios/build -type d -path '*ReleaseDevelopment-iphonesimulator/*.app' -prune 2>/dev/null | head -1)
          test -n "$APP"
          test -f "$APP/main.jsbundle"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | tee bundle-id.txt
          git diff --exit-code -- src package.json package-lock.json
          mkdir qa-output
          ditto -c -k --keepParent "$APP" qa-output/app.zip
          printf '{"source_sha":"%s","configuration":"ReleaseDevelopment","destination":"simulator","bundler":"metro","bundle_id":"%s","run_id":"%s"}\n' "$SOURCE_SHA" "$(cat bundle-id.txt)" "$GITHUB_RUN_ID" > qa-output/provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-qa-${{ inputs.source_sha }}
          path: qa-output/
          if-no-files-found: error
          retention-days: 14

  js:
    if: inputs.build_unminified_js
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      NODE_OPTIONS: --max-old-space-size=6144
      BUNDLER: metro
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: KJ21-ENG/App
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION=$(node -p 'require("./package.json").engines.npm')
          npm exec --yes --package="npm@$NPM_VERSION" -- npm ci --no-audit --no-fund --no-update-notifier
      - name: Bundle unminified iOS JS
        shell: bash
        run: |
          set -euo pipefail
          printf 'ENVIRONMENT=development\nUSE_WEB_PROXY=false\n' > .env
          mkdir out
          # Plain JS source; Hermes runs it directly when it replaces main.jsbundle in the app, with readable stack traces.
          node_modules/.bin/rock bundle --platform ios --dev false --minify false --entry-file index.js --bundle-output out/main.jsbundle --sourcemap-output out/main.jsbundle.map --assets-dest out/assets
          git diff --exit-code -- src package.json package-lock.json
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-js-${{ inputs.source_sha }}
          path: |
            out/main.jsbundle
            out/main.jsbundle.map
          if-no-files-found: error
          retention-days: 14
