name: Locate exact compatible official Android APK

on:
  push:
    branches:
      - chatgpt/emulator-regression-93877
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IS_HYBRID_APP: "true"
      ENV: adhoc
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      EXACT_HEAD: 78ef1215915a659779791df28c40111a64fd83bb
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact App head and exact Mobile-Expensify submodule
        uses: actions/checkout@v4
        with:
          repository: Expensify/App
          ref: 78ef1215915a659779791df28c40111a64fd83bb
          fetch-depth: 1
          submodules: recursive

      - name: Verify exact revisions and compute official identifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          APP_SHORT="$(git rev-parse --short HEAD)"
          MOBILE_HEAD="$(git -C Mobile-Expensify rev-parse HEAD)"
          MOBILE_SHORT="$(git -C Mobile-Expensify rev-parse --short HEAD)"
          test "$MOBILE_HEAD" = 'c800599a8f11425e674d6a0cf9cd23ff5e3cb3f4'
          {
            echo "APP_SHORT=$APP_SHORT"
            echo "MOBILE_HEAD=$MOBILE_HEAD"
            echo "MOBILE_SHORT=$MOBILE_SHORT"
            echo "IDENTIFIER=${APP_SHORT}-${MOBILE_SHORT}"
          } | tee /tmp/revision-metadata.txt
          {
            echo "APP_SHORT=$APP_SHORT"
            echo "MOBILE_SHORT=$MOBILE_SHORT"
            echo "IDENTIFIER=${APP_SHORT}-${MOBILE_SHORT}"
          } >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact root dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          npm ci

      - name: Prepare official ad-hoc environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.staging .env.adhoc
          sed -i 's/ENVIRONMENT=staging/ENVIRONMENT=adhoc/' .env.adhoc

      - name: Compute exact official hybrid native fingerprint
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT="$(npx rock fingerprint -p android --raw)"
          test -n "$FINGERPRINT"
          printf '%s\n' "$FINGERPRINT" | tee /tmp/hybrid-native-fingerprint.txt
          echo "HYBRID_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"

      - name: Search PR comments and deterministic ad-hoc paths
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk-search
          BASE='https://ad-hoc-expensify-cash.s3.us-east-1.amazonaws.com/rock-artifacts/ad-hoc'

          for page in 1 2; do
            curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/Expensify/App/issues/93877/comments?per_page=100&page=$page" \
              > "/tmp/apk-search/comments-$page.json"
          done

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path('/tmp/apk-search')
          comments = []
          for page in (1, 2):
              comments.extend(json.loads((root / f'comments-{page}.json').read_text()))

          fingerprint = os.environ['HYBRID_FINGERPRINT']
          all_urls = []
          matching_urls = []
          for comment in comments:
              for url in re.findall(
                  r'https://ad-hoc-expensify-cash\.s3\.[^\s|)]+/rock-artifacts/ad-hoc/rock-android-Adhoc-[^\s|)]+/index\.html',
                  comment.get('body', ''),
              ):
                  all_urls.append((comment.get('created_at'), comment.get('id'), url))
                  if f'-{fingerprint}/index.html' in url:
                      matching_urls.append((comment.get('created_at'), comment.get('id'), url))

          (root / 'all-pr-android-builds.txt').write_text(
              ''.join(f'{created_at} comment={comment_id} {url}\n' for created_at, comment_id, url in all_urls)
          )
          (root / 'matching-pr-android-builds.txt').write_text(
              ''.join(f'{created_at} comment={comment_id} {url}\n' for created_at, comment_id, url in matching_urls)
          )
          print(f'PR Android build URLs found: {len(all_urls)}')
          print(f'Fingerprint-compatible PR URLs found: {len(matching_urls)}')
          PY

          : > /tmp/apk-search/probe-results.txt
          CANDIDATES=()

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            CANDIDATES+=("${line##* }")
          done < /tmp/apk-search/matching-pr-android-builds.txt

          # The official Android workflow names the directory from App short SHA,
          # Mobile-Expensify short SHA, and the hybrid native fingerprint.
          CANDIDATES+=("${BASE}/rock-android-Adhoc-${IDENTIFIER}-${HYBRID_FINGERPRINT}/index.html")
          CANDIDATES+=("${BASE}/rock-android-Adhoc-${EXACT_HEAD:0:7}-${MOBILE_HEAD:0:7}-${HYBRID_FINGERPRINT}/index.html")
          CANDIDATES+=("${BASE}/rock-android-Adhoc-${EXACT_HEAD:0:10}-${MOBILE_HEAD:0:7}-${HYBRID_FINGERPRINT}/index.html")
          CANDIDATES+=("${BASE}/rock-android-Adhoc-${EXACT_HEAD:0:11}-${MOBILE_HEAD:0:7}-${HYBRID_FINGERPRINT}/index.html")

          FOUND=''
          for url in "${CANDIDATES[@]}"; do
            if grep -Fxq "$url" /tmp/apk-search/already-probed.txt 2>/dev/null; then
              continue
            fi
            printf '%s\n' "$url" >> /tmp/apk-search/already-probed.txt
            code="$(curl -L -sS -o /tmp/apk-search/index.html -w '%{http_code}' --connect-timeout 30 --max-time 120 "$url" || true)"
            bytes="$(stat -c '%s' /tmp/apk-search/index.html 2>/dev/null || printf '0')"
            printf '%s http=%s bytes=%s\n' "$url" "$code" "$bytes" | tee -a /tmp/apk-search/probe-results.txt
            if [ "$code" = '200' ] && grep -q 'apkFileName' /tmp/apk-search/index.html; then
              FOUND="$url"
              printf '%s\n' "$url" > /tmp/apk-search/found-index-url.txt
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo 'No exact-fingerprint official ad-hoc APK was found.' >&2
            exit 1
          fi

          python3 - <<'PY'
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          root = pathlib.Path('/tmp/apk-search')
          index_url = (root / 'found-index-url.txt').read_text().strip()
          page = (root / 'index.html').read_text(errors='replace')
          match = re.search(r"const\s+apkFileName\s*=\s*['\"]([^'\"]+\.apk)['\"]", page)
          if not match:
              raise SystemExit('Could not derive APK filename from Rock index page')
          apk_url = urllib.parse.urljoin(index_url, match.group(1))
          (root / 'found-apk-url.txt').write_text(apk_url + '\n')
          request = urllib.request.Request(apk_url, headers={'User-Agent': 'exact-head-regression-locator'})
          with urllib.request.urlopen(request, timeout=900) as response, open(root / 'Expensify-exact-official.apk', 'wb') as output:
              while chunk := response.read(1024 * 1024):
                  output.write(chunk)
          PY

          file /tmp/apk-search/Expensify-exact-official.apk
          sha256sum /tmp/apk-search/Expensify-exact-official.apk \
            | tee /tmp/apk-search/APK_SHA256SUM.txt
          ls -lh /tmp/apk-search/Expensify-exact-official.apk

      - name: Upload located exact official APK
        uses: actions/upload-artifact@v4
        with:
          name: expensify-93877-exact-official-apk
          path: |
            /tmp/apk-search/Expensify-exact-official.apk
            /tmp/apk-search/APK_SHA256SUM.txt
            /tmp/apk-search/found-index-url.txt
            /tmp/apk-search/found-apk-url.txt
            /tmp/apk-search/probe-results.txt
            /tmp/apk-search/all-pr-android-builds.txt
            /tmp/apk-search/matching-pr-android-builds.txt
            /tmp/hybrid-native-fingerprint.txt
            /tmp/revision-metadata.txt
          compression-level: 0
          retention-days: 3

      - name: Upload fingerprint evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exact-hybrid-fingerprint-search-evidence
          path: |
            /tmp/apk-search/probe-results.txt
            /tmp/apk-search/all-pr-android-builds.txt
            /tmp/apk-search/matching-pr-android-builds.txt
            /tmp/hybrid-native-fingerprint.txt
            /tmp/revision-metadata.txt
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
