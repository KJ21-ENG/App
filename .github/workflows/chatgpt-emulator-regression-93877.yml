name: Build exact-head emulator APK from matching native cache

on:
  push:
    branches:
      - chatgpt/emulator-regression-93877
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STANDALONE_NEW_DOT: "true"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      IS_HYBRID_APP: "false"
      ENV: adhoc
      EXACT_HEAD: 78ef1215915a659779791df28c40111a64fd83bb
      NATIVE_FINGERPRINT: 09678c18e7a6107bd501ae35dfbee45ee92f3f1a
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact upstream PR head
        uses: actions/checkout@v4
        with:
          repository: Expensify/App
          ref: 78ef1215915a659779791df28c40111a64fd83bb
          fetch-depth: 1
          submodules: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          printf '%s\n' "$EXACT_HEAD" > /tmp/EXACT_HEAD_SHA.txt

      - name: Download matching public Rock native cache
        id: native-cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-cache/download /tmp/native-cache/extracted
          BASE_URL='https://ad-hoc-expensify-cash.s3.us-east-1.amazonaws.com/rock-artifacts'
          CANDIDATES=(
            "rock-android-Adhoc-${NATIVE_FINGERPRINT}.zip"
            "rock-android-Adhoc-93877-${NATIVE_FINGERPRINT}.zip"
            "rock-android-Adhoc-4-${NATIVE_FINGERPRINT}.zip"
          )

          : > /tmp/native-cache/probe-results.txt
          FOUND=''
          for object_name in "${CANDIDATES[@]}"; do
            url="${BASE_URL}/${object_name}"
            destination="/tmp/native-cache/download/${object_name}"
            echo "Probing ${url}" | tee -a /tmp/native-cache/probe-results.txt
            http_code="$(curl \
              --location \
              --silent \
              --show-error \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 900 \
              --output "$destination" \
              --write-out '%{http_code}' \
              "$url" || true)"
            size="$(stat -c '%s' "$destination" 2>/dev/null || printf '0')"
            printf '%s http=%s bytes=%s\n' "$object_name" "$http_code" "$size" \
              | tee -a /tmp/native-cache/probe-results.txt

            if [ "$http_code" = '200' ] && [ "$size" -gt 1000000 ] && unzip -tq "$destination" >/dev/null; then
              FOUND="$destination"
              printf '%s\n' "$object_name" > /tmp/native-cache/matched-object-name.txt
              printf '%s\n' "$url" > /tmp/native-cache/matched-object-url.txt
              break
            fi
            rm -f "$destination"
          done

          if [ -z "$FOUND" ]; then
            echo 'No matching public native cache object was found.' >&2
            exit 1
          fi

          unzip -q "$FOUND" -d /tmp/native-cache/extracted
          find /tmp/native-cache/extracted -maxdepth 5 -type f -printf '%P %s bytes\n' \
            | sort | tee /tmp/native-cache/extracted-files.txt

          APK_PATH="$(find /tmp/native-cache/extracted -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo 'The matching cache ZIP did not contain an APK.' >&2
            exit 1
          fi

          cp "$APK_PATH" /tmp/native-cache/matching-native-shell.apk
          printf '%s\n' "$APK_PATH" > /tmp/native-cache/original-apk-path.txt
          sha256sum /tmp/native-cache/matching-native-shell.apk \
            | tee /tmp/native-cache/NATIVE_SHELL_SHA256SUM.txt
          file /tmp/native-cache/matching-native-shell.apk
          ls -lh /tmp/native-cache/matching-native-shell.apk

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact project dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          npm ci

      - name: Prepare exact adhoc environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.staging .env.adhoc
          sed -i 's/ENVIRONMENT=staging/ENVIRONMENT=adhoc/' .env.adhoc

      - name: Install Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;36.0.0' 'platform-tools'

      - name: Apply exact Hermes bundle using Rock standard re-sign flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/exact-output
          npx rock sign:android /tmp/native-cache/matching-native-shell.apk \
            --build-jsbundle \
            --keystore android/app/debug.keystore \
            --keystore-password android \
            --key-alias androiddebugkey \
            --key-password android \
            --output /tmp/exact-output/Expensify-93877-78ef121-emulator.apk

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs \
            /tmp/exact-output/Expensify-93877-78ef121-emulator.apk \
            | tee /tmp/exact-output/apksigner-verification.txt
          sha256sum /tmp/exact-output/Expensify-93877-78ef121-emulator.apk \
            | tee /tmp/exact-output/APK_SHA256SUM.txt

          unzip -p /tmp/exact-output/Expensify-93877-78ef121-emulator.apk \
            assets/index.android.bundle > /tmp/exact-output/index.android.bundle
          file /tmp/exact-output/index.android.bundle \
            | tee /tmp/exact-output/bundle-file-type.txt
          ls -lh /tmp/exact-output/Expensify-93877-78ef121-emulator.apk \
            /tmp/exact-output/index.android.bundle

          cat > /tmp/exact-output/build-provenance.txt <<EOF
          exact_head=${EXACT_HEAD}
          native_fingerprint=${NATIVE_FINGERPRINT}
          matched_cache_object=$(cat /tmp/native-cache/matched-object-name.txt)
          matched_cache_url=$(cat /tmp/native-cache/matched-object-url.txt)
          re_sign_method=rock sign:android --build-jsbundle
          environment=adhoc
          EOF

      - name: Upload exact-head APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: expensify-93877-78ef121-emulator-apk
          path: |
            /tmp/exact-output/Expensify-93877-78ef121-emulator.apk
            /tmp/exact-output/APK_SHA256SUM.txt
            /tmp/exact-output/apksigner-verification.txt
            /tmp/exact-output/bundle-file-type.txt
            /tmp/exact-output/build-provenance.txt
            /tmp/EXACT_HEAD_SHA.txt
            /tmp/native-cache/probe-results.txt
            /tmp/native-cache/matched-object-name.txt
            /tmp/native-cache/NATIVE_SHELL_SHA256SUM.txt
            /tmp/native-cache/extracted-files.txt
          compression-level: 0
          retention-days: 3

      - name: Upload cache probe evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exact-native-cache-probe-evidence
          path: |
            /tmp/native-cache/probe-results.txt
            /tmp/native-cache/extracted-files.txt
            /tmp/native-cache/matched-object-name.txt
            /tmp/native-cache/matched-object-url.txt
            /tmp/EXACT_HEAD_SHA.txt
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
