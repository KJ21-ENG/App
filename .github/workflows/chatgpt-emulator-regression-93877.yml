name: Build exact PR head Android APK for emulator regression

on:
  push:
    branches:
      - chatgpt/emulator-regression-93877
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bundle-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      STANDALONE_NEW_DOT: "true"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      IS_HYBRID_APP: "false"
      ENV: adhoc
    steps:
      - name: Checkout exact upstream PR head
        uses: actions/checkout@v4
        with:
          repository: Expensify/App
          ref: 78ef1215915a659779791df28c40111a64fd83bb
          fetch-depth: 1
          submodules: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "78ef1215915a659779791df28c40111a64fd83bb"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up exact npm and dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          node --version
          npm --version
          bun --version
          npm ci

      - name: Prepare adhoc environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.staging .env.adhoc
          sed -i 's/ENVIRONMENT=staging/ENVIRONMENT=adhoc/' .env.adhoc

      - name: Install exact Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          test -f "$ANDROID_SDK_ROOT/ndk/27.1.12297006/source.properties"
          printf 'sdk.dir=%s\nndk.dir=%s\n' \
            "$ANDROID_SDK_ROOT" \
            "$ANDROID_SDK_ROOT/ndk/27.1.12297006" \
            > android/local.properties
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0|ndk;27.1.12297006'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build exact native APK and inject exact-head bundle
        id: rock-build
        continue-on-error: true
        uses: callstackincubator/android@4cedf4d9b5c167452c96fe67233577e0fde9a025
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          IS_HYBRID_APP: "false"
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
        with:
          variant: Adhoc
          aab: false
          sign: true
          re-sign: true
          ad-hoc: true
          setup-java: false
          keystore-file: android/app/debug.keystore
          keystore-store-file: debug.keystore
          keystore-store-password: android
          keystore-key-alias: androiddebugkey
          keystore-key-password: android
          keystore-path: app/debug.keystore
          comment-bot: false
          custom-identifier: exact-78ef121
          rock-build-extra-params: '--extra-params "-PreactNativeArchitectures=x86_64 --profile"'

      - name: Collect APK candidates and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/exact-apk-candidates
          find android .rock -type f -name '*.apk' -print -exec cp -v '{}' /tmp/exact-apk-candidates/ \; 2>/dev/null || true
          printf 'rock_step_outcome=%s\n' '${{ steps.rock-build.outcome }}' > /tmp/exact-apk-candidates/BUILD_STATUS.txt
          printf 'exact_head=%s\n' '78ef1215915a659779791df28c40111a64fd83bb' >> /tmp/exact-apk-candidates/BUILD_STATUS.txt
          find /tmp/exact-apk-candidates -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Upload APK candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-android-apk-candidates-v2
          path: /tmp/exact-apk-candidates
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
