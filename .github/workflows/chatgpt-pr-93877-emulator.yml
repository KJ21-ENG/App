# Retry with bounded emulator startup diagnostics.
name: Temporary PR 93877 Android emulator probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-pr-93877-emulator.yml

permissions:
  actions: read
  contents: write

jobs:
  emulator-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APK_ARTIFACT_ID: "9474257761"
      RESULT_BRANCH: chatgpt/emulator-regression-93877
    steps:
      - name: Checkout temporary result branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RESULT_BRANCH }}
          fetch-depth: 1

      - name: Publish active run marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .chatgpt-regression
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow_sha=$GITHUB_SHA"
            echo "phase=active"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .chatgpt-regression/probe-active-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .chatgpt-regression/probe-active-run-id.txt
          git commit -m "Record active PR 93877 emulator probe $GITHUB_RUN_ID"
          git push origin "HEAD:$RESULT_BRANCH"

      - name: Download verified exact-JS APK artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk "$GITHUB_WORKSPACE/android-regression-evidence"
          curl --fail --location --retry 3 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/KJ21-ENG/App/actions/artifacts/${APK_ARTIFACT_ID}/zip" \
            -o /tmp/apk/artifact.zip
          unzip -q /tmp/apk/artifact.zip -d /tmp/apk/extracted
          APK="$(find /tmp/apk/extracted -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          file "$APK"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/android-regression-evidence/APK_SHA256SUM.txt"
          ls -lh "$APK"

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | "$AVDMANAGER" create avd \
            --force \
            --name pr93877 \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device 'pixel_6'
          sudo chown root:kvm /dev/kvm || true
          sudo chmod 660 /dev/kvm || true

      - name: Boot emulator and run discovery probe
        shell: bash
        run: bash .chatgpt-regression/run-emulator-probe.sh

      - name: Upload emulator probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expensify-93877-emulator-probe-evidence
          path: android-regression-evidence/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3

      - name: Publish completed run marker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow_sha=$GITHUB_SHA"
            echo "phase=completed"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .chatgpt-regression/probe-run-id.txt
          git add .chatgpt-regression/probe-run-id.txt
          git commit -m "Record completed PR 93877 emulator probe $GITHUB_RUN_ID" || true
          git pull --rebase origin "$RESULT_BRANCH"
          git push origin "HEAD:$RESULT_BRANCH"
