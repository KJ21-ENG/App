# Personal validation workflow for the KJ21-ENG/App fork.
#
# This file lives ONLY on the fork's default branch (main). It must never be
# committed to a feature branch and never appear in a PR to Expensify/App.
# Deploy/update it with:
#   python3 ~/.codex/skills/expensify-app-targeted-checks/scripts/fork_checks.py setup
#
# It is dispatch-only (never triggers on push/PR). The dispatch ref is always
# `main` (where this file lives); the branch/commit under test is passed as an
# input and checked out explicitly. All tooling (setupNode composite action,
# lint.sh, tsconfig, jest config) comes from the checked-out branch tree, so
# results match what upstream CI would produce for that commit.
name: Fork checks
run-name: 'fork-checks: ${{ inputs.branch }} @ ${{ inputs.sha }} [${{ inputs.checks }}] profile=${{ inputs.profile }} tag=${{ inputs.tag }}'

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Fork branch to validate
        required: true
        type: string
      sha:
        description: Exact commit to validate (empty = branch tip at checkout time)
        required: false
        default: ''
        type: string
      profile:
        description: Validation profile metadata (targeted pilot default, or explicit full gate)
        required: false
        default: targeted
        type: choice
        options:
          - targeted
          - full
      checks:
        description: 'Exact comma-separated check tokens supplied by fork_checks.py'
        required: false
        default: 'format-targeted,lint-targeted,react-compiler'
        type: string
      jest_args:
        description: Arguments passed to jest (test paths, -t patterns, --runInBand). Empty = jest job no-ops.
        required: false
        default: ''
        type: string
      rc_files:
        description: Space-separated .ts/.tsx files for the React Compiler check. Empty = job no-ops.
        required: false
        default: ''
        type: string
      format_files:
        description: Space-separated files for targeted oxfmt/prettier. Empty = targeted job no-ops.
        required: false
        default: ''
        type: string
      lint_files:
        description: Space-separated JS/TS files for targeted ESLint. Empty = targeted job no-ops.
        required: false
        default: ''
        type: string
      tag:
        description: Opaque dispatch tag used by tooling to identify this run
        required: false
        default: ''
        type: string
      merge_base:
        description: Merge-base with upstream main; keys the ESLint cache per upstream sync instead of per commit. Empty = fall back to sha/branch.
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Re-dispatching the same branch with the same check set cancels the stale run.
# Different branches (or different check sets) run side by side.
concurrency:
  group: fork-checks-${{ inputs.branch }}-${{ inputs.profile }}-${{ inputs.checks }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  typecheck:
    name: TypeScript (tsc, CI merge gate)
    if: contains(format(',{0},', inputs.checks), ',typecheck-full,')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || inputs.branch }}

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Type check with TypeScript
        run: npm run typecheck

  lint:
    name: ESLint (full repo, CI merge gate)
    if: contains(format(',{0},', inputs.checks), ',lint-full,')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || inputs.branch }}

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Normalize package-lock for cache key
        run: jq 'del(.version, .packages[""].version)' package-lock.json > normalized-package-lock.json

      # Keyed by merge-base with upstream main: one cache entry per upstream sync
      # instead of per commit, so entries stop churning out of the 10GB LRU limit.
      - name: Restore ESLint cache
        id: restore-eslint
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.mjs', 'config/eslint/**', 'normalized-package-lock.json') }}-${{ inputs.merge_base != '' && inputs.merge_base || (inputs.sha != '' && inputs.sha || inputs.branch) }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.mjs', 'config/eslint/**', 'normalized-package-lock.json') }}-
            ${{ runner.os }}-eslint-

      # ESLint's cache doesn't track cross-file TypeScript dependencies, which can
      # cause stale errors. Mirror upstream CI's clear-cache-and-retry, but only
      # when a cache was actually restored — a failure on a cold cache is
      # deterministic, and retrying it just doubles a ~45-minute run.
      - name: Lint JavaScript and TypeScript with ESLint
        env:
          RESTORED_ESLINT_CACHE: ${{ steps.restore-eslint.outputs.cache-matched-key }}
        run: |
          if ! npm run lint; then
            if [ -n "$RESTORED_ESLINT_CACHE" ]; then
              echo "Lint failed with a restored cache; clearing cache and retrying..."
              rm -rf node_modules/.cache/eslint
              npm run lint
            else
              echo "Lint failed on a cold cache; the result is deterministic, not retrying."
              exit 1
            fi
          fi

      - name: Save ESLint cache
        uses: actions/cache/save@v4
        if: success() && steps.restore-eslint.outputs.cache-hit != 'true'
        with:
          path: node_modules/.cache/eslint
          key: ${{ steps.restore-eslint.outputs.cache-primary-key }}

  lint-targeted:
    name: ESLint (changed files, targeted pilot)
    if: contains(format(',{0},', inputs.checks), ',lint-targeted,')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || inputs.branch }}

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Lint changed JavaScript and TypeScript files
        env:
          LINT_FILES: ${{ inputs.lint_files }}
        run: |
          if [ -z "$LINT_FILES" ]; then
            echo "::notice::No lint_files provided; nothing to check."
            exit 0
          fi
          read -ra FILES <<< "$LINT_FILES"
          npm run lint -- "${FILES[@]}"

  prettier:
    name: Format check (targeted/full)
    if: contains(format(',{0},', inputs.checks), ',format-targeted,') || contains(format(',{0},', inputs.checks), ',format-full,')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || inputs.branch }}

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      # Auto-detects the branch's formatter era and mirrors that era's CI gate:
      # oxfmt via `npm run fmt` + diff check (current, mirrors upstream oxfmt.yml),
      # prettier --check on changed files (older branches), or clean skip.
      - name: Format check
        env:
          FORMAT_FILES: ${{ inputs.format_files }}
          CHECKS: ${{ inputs.checks }}
        run: |
          MODE=targeted
          if [[ ",$CHECKS," == *",format-full,"* ]]; then
            MODE=full
          fi
          if node -e "process.exit(require('./package.json').scripts.fmt ? 0 : 1)"; then
            if [ "$MODE" = full ]; then
              npm run fmt
              if ! git diff --name-only --exit-code; then
                echo 'Error: Oxfmt diff detected! Run `npm run fmt` locally and commit the changes.'
                exit 1
              fi
            else
              if [ -z "$FORMAT_FILES" ]; then
                echo "::notice::No format_files provided; nothing to check."
                exit 0
              fi
              read -ra FILES <<< "$FORMAT_FILES"
              npx --no-install oxfmt --check "${FILES[@]}"
            fi
          elif node -e "const p=require('./package.json'); process.exit((p.devDependencies||{}).prettier||(p.dependencies||{}).prettier?0:1)"; then
            if [ "$MODE" = full ]; then
              npx --no-install prettier --check .
            else
              if [ -z "$FORMAT_FILES" ]; then
                echo "::notice::prettier-era branch and no format_files provided; nothing to check."
                exit 0
              fi
              read -ra FILES <<< "$FORMAT_FILES"
              npx --no-install prettier --check "${FILES[@]}"
            fi
          else
            echo "::notice::No fmt/prettier tooling on this branch; skipping."
            exit 0
          fi

  react-compiler:
    name: React Compiler compliance (changed files)
    if: contains(format(',{0},', inputs.checks), ',react-compiler,')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || inputs.branch }}

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: React Compiler compliance check
        env:
          RC_FILES: ${{ inputs.rc_files }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RC_FILES" ]; then
            echo "::notice::No rc_files provided; nothing to check."
            exit 0
          fi
          # shellcheck disable=SC2086
          npm run react-compiler-compliance-check check $RC_FILES

  jest:
    name: Jest (targeted)
    if: contains(format(',{0},', inputs.checks), ',jest,')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || inputs.branch }}

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Cache Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-fork-${{ hashFiles('package-lock.json', 'patches/**', 'babel.config.js') }}
          restore-keys: ${{ runner.os }}-jest-fork-

      - name: Jest tests
        env:
          JEST_ARGS: ${{ inputs.jest_args }}
        run: |
          if [ -z "$JEST_ARGS" ]; then
            echo "::notice::No jest_args provided; nothing to run."
            exit 0
          fi
          # shellcheck disable=SC2086
          npm test -- --silent $JEST_ARGS
