# Temporary smoke test for the gh-dev Tailscale setup. Deleted after the test.
name: TS smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-dev-smoke
          args: --ssh
      - name: Start OpenSSH on 2222 for mutagen
        run: |
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBS/phmhBDwn8LLSfp0FM1rlpSHBkDKoqBO2qhLa3bdq gh-dev-runner-access" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222
          echo "sshd up on 2222"
      - name: Wait for probes
        run: |
          tailscale status --self
          sleep 900
