name: Fork standalone Android QA
run-name: "standalone-qa: ${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact existing KJ21-ENG/App commit to build
        required: true
        type: string
      build_android:
        description: Produce self-contained physical Android APK
        required: true
        default: true
        type: boolean
      build_web:
        description: Also produce web assets for physical Chrome mWeb QA
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  android:
    if: inputs.build_android
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: KJ21-ENG/App
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify source and read toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'java=%s\n' "$(tr -d '[:space:]' < .java-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION=$(node -p 'require("./package.json").engines.npm')
          npm exec --yes --package="npm@$NPM_VERSION" -- npm ci --no-audit --no-fund --no-update-notifier
      - name: Expose project-pinned bun for the React Native artifact resolver
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/node_modules/.bin/bun" --version
      - name: Flatten renamed Hermes tarball (facebook/hermes moved to meta/hermes)
        shell: bash
        run: |
          set -euo pipefail
          HERMES_GRADLE=node_modules/react-native/ReactAndroid/hermes-engine/build.gradle.kts
          grep -q 'startsWith("facebook-hermes-")' "$HERMES_GRADLE"
          sed -i 's/startsWith("facebook-hermes-")/startsWith("meta-hermes-")/' "$HERMES_GRADLE"
          grep -q 'startsWith("meta-hermes-")' "$HERMES_GRADLE"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
      - name: Configure contributor build
        shell: bash
        run: |
          set -euo pipefail
          # Public contributor defaults only; no personal .env or account data.
          printf 'ENVIRONMENT=development\nUSE_WEB_PROXY=false\n' > .env
          # Release JavaScript and normal asset packaging, signed with the
          # repository's public debug key so the existing Dev app can update.
          cat > "$RUNNER_TEMP/qa-signing.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              p.afterEvaluate {
                  if (p.path == ':app') {
                      def android = p.extensions.findByName('android')
                      if (android != null) {
                          // Public contributor QA: optional vendor SafetyNet classes are unavailable to R8.
                          android.buildTypes.release.minifyEnabled = false
                          android.buildTypes.release.shrinkResources = false
                          android.signingConfigs.release.storeFile = p.file('debug.keystore')
                          android.signingConfigs.release.storePassword = 'android'
                          android.signingConfigs.release.keyAlias = 'androiddebugkey'
                          android.signingConfigs.release.keyPassword = 'android'
                      }
                  }
              }
          }
          GRADLE
      - name: Build self-contained APK
        working-directory: android
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDevelopmentRelease \
            --init-script "$RUNNER_TEMP/qa-signing.gradle" \
            -PreactNativeArchitectures=arm64-v8a --max-workers=2 --no-daemon
      - name: Verify package and create provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir qa-output
          cp android/app/build/outputs/apk/development/release/*.apk qa-output/app.apk
          SDK_ROOT=$(printenv ANDROID_HOME)
          BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt2" dump badging qa-output/app.apk > qa-output/package.txt
          grep -Fq "package: name='com.expensify.chat.dev'" qa-output/package.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs qa-output/app.apk > qa-output/signature.txt
          git diff --exit-code -- src android package.json package-lock.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          p = pathlib.Path('qa-output')
          apk = p / 'app.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.getinfo('assets/index.android.bundle').file_size > 1000
              assert any(n.startswith('lib/arm64-v8a/') for n in z.namelist())
          manifest = {
              'source_sha': os.environ['SOURCE_SHA'],
              'workflow_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'configuration': 'developmentRelease',
              'bundler': 'repack (default)',
              'packaging_override': 'External Gradle init: repository debug signing key; native R8 and resource shrinking disabled for public contributor QA. Normal release JavaScript bundling retained.',
              'app_id': 'com.expensify.chat.dev',
              'apk_sha256': hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest(),
              'contains_js_bundle': True,
              'device_launch_verification': 'pending',
          }
          (p / 'provenance.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-qa-${{ inputs.source_sha }}
          path: qa-output/
          if-no-files-found: error
          retention-days: 14

  web:
    if: inputs.build_web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: KJ21-ENG/App
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies
        run: |
          NPM_VERSION=$(node -p 'require("./package.json").engines.npm')
          npm exec --yes --package="npm@$NPM_VERSION" -- npm ci --no-audit --no-fund --no-update-notifier
      - name: Bundle JS and symbolicate crash offsets
        run: |
          set -euo pipefail
          printf 'ENVIRONMENT=development\nUSE_WEB_PROXY=false\n' > .env
          mkdir out
          # QA only: load Worklets before Reanimated so its native install finds the UI runtime holder.
          grep -q "^import App from './src/App';" index.js
          sed -i "s#^import App from './src/App';#import 'react-native-worklets';\nimport App from './src/App';#" index.js
          grep -n -A1 "react-native-worklets" index.js
          node_modules/.bin/rock bundle --platform android --dev false --entry-file index.js --bundle-output out/index.android.bundle.js --sourcemap-output out/packager.map --assets-dest out/res --minify true
          HC=$(find node_modules -path '*linux64-bin/hermesc' | head -1)
          grep -o '.\{320\}__UI_WORKLET_RUNTIME_HOLDER.\{320\}' out/index.android.bundle.js > out/holder.txt || true
          cat out/holder.txt | cut -c1-900
          grep -oE '.{80}\bglobalThis *=[^=].{80}|[(,]globalThis[,)].{60}' out/index.android.bundle.js | head -12 || true
          node_modules/.bin/rock bundle --platform android --dev false --entry-file index.js --bundle-output out/index.android.bundle.js --sourcemap-output out/packager.map --assets-dest out/res --minify false
          "$HC" -w -emit-binary -max-diagnostic-width=80 -out out/index.android.bundle -O out/index.android.bundle.js
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: js-qa-${{ inputs.source_sha }}
          path: |
            out/index.android.bundle
          if-no-files-found: error
          retention-days: 7
