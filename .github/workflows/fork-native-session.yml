# Remote NATIVE-session workflow for the KJ21-ENG/App fork (MC Ops module).
#
# This file lives ONLY on the fork's default branch (main) — same rule as
# fork-checks.yml / fork-dev-server.yml: never on a feature branch, never in a
# PR to Expensify/App. Deploy/update it with:
#   expensify-mission-control/tools/deploy-fork-dev-workflow.sh (native variant)
#
# One dispatch = one interactive device session for a branch. The default
# `remote` target preserves the streamed runner-hosted device:
#   android: ubuntu-latest + KVM emulator + ws-scrcpy web UI on :8000
#   ios:     macos-latest + iOS Simulator + baguette web UI on :8421
# The `local` target keeps Metro/build/cache work on the runner, but stages the
# installable app for a device hosted on the operator's Mac instead of starting
# an emulator/simulator or stream UI on the runner.
#
# The app binary resolves through a THREE-TIER cache (fastest first):
#   1. the fork's `rock-cache` release, keyed by exact Rock fingerprint
#      (self-populated; survives Expensify outages; ~seconds to download);
#   2. Rock's own remote cache (Expensify's public S3 — observed returning
#      AccessDenied to anonymous reads on 2026-07-30, hence tier 1);
#   3. a local build (slow: ~45-90 min Android / ~1.5-2.5 h iOS on free
#      runners) whose product is then UPLOADED to tier 1, so each fingerprint
#      pays the build cost at most once.
# Metro runs next to the device, so JS edits synced by the MC driver (mutagen)
# hot-reload into the streamed device.
#
# Handshake sentinels with the MC session driver (mirrors fork-dev-server.yml):
# Remote target (backward compatible globals):
#   /tmp/env-provisioned  (driver -> runner: local .env uploaded; Metro may start)
#   /tmp/stream-ready     (runner -> driver: stream UI answering on its port)
#   /tmp/stop-session     (driver -> runner: graceful shutdown requested)
# Local target (session scoped; tag is validated before it reaches the path):
#   /tmp/ops-native-<tag>/env-provisioned
#   /tmp/ops-native-<tag>/local-device-ready
#   /tmp/ops-native-<tag>/stop-session
#
# The driver forwards <session port> -> localhost:<stream port> over sshd:2222
# and shows http://localhost:<session port>/… as the session URL.
name: Fork native session
run-name: 'native: ${{ inputs.platform }} ${{ inputs.branch }} @ ${{ inputs.sha }} tag=${{ inputs.tag }}'

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Fork branch being hosted (used for the scratch ref + concurrency group)
        required: true
        type: string
      sha:
        description: Exact commit to check out (reachable via the fork-dev/<branch> scratch ref)
        required: true
        type: string
      platform:
        description: android | ios
        required: true
        type: string
      device_target:
        description: Run the device on the Actions runner (remote) or the operator's Mac (local)
        required: true
        default: remote
        type: choice
        options:
          - remote
          - local
      ssh_pubkey:
        description: Public key appended to the runner's authorized_keys for sshd :2222
        required: true
        type: string
      slug:
        description: Tailnet-safe session slug; the runner joins as gh-dev-<slug>
        required: true
        type: string
      tag:
        description: Opaque dispatch tag used by the driver to locate this run
        required: false
        default: ''
        type: string

# contents:write so sessions can upload freshly-built artifacts to the
# fork's rock-cache release (tier 1 of the artifact cache).
permissions:
  contents: write

# Re-dispatching the same platform+branch supersedes the older session for it.
concurrency:
  group: fork-native-${{ inputs.platform }}-${{ inputs.branch }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  android:
    name: Android emulator session
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    # Clean end before the 6h hard job kill (350 min = 5h50m).
    timeout-minutes: 350
    steps:
      - name: Timer start
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}

      - name: Prepare local-device session directory
        if: ${{ inputs.device_target == 'local' }}
        env:
          OPS_NATIVE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$OPS_NATIVE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]] || [ "${#OPS_NATIVE_TAG}" -gt 64 ]; then
            echo "ERROR: local-device tag must be 1-64 ASCII letters, digits, underscores, or hyphens"
            exit 1
          fi
          OPS_NATIVE_SESSION_DIR="/tmp/ops-native-${OPS_NATIVE_TAG}"
          mkdir -p "$OPS_NATIVE_SESSION_DIR"
          chmod 700 "$OPS_NATIVE_SESSION_DIR"
          rm -f "$OPS_NATIVE_SESSION_DIR/local-device-ready" "$OPS_NATIVE_SESSION_DIR/stop-session"
          printf 'OPS_NATIVE_SESSION_DIR=%s\n' "$OPS_NATIVE_SESSION_DIR" >> "$GITHUB_ENV"

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-dev-${{ inputs.slug }}
          args: --ssh

      - name: Start OpenSSH on :2222
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ inputs.ssh_pubkey }}" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          # Tailscale SSH owns :22 once --ssh is active, so real sshd is on :2222.
          sudo /usr/sbin/sshd -p 2222
          echo "TIMING[sshd] $(( $(date +%s) - T0 ))s"

      - name: Enable KVM and launch emulator early (boots during npm ci)
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          # Disk headroom: the root disk has only ~20-25 GB free and a tier-3
          # gradle build needs most of it. Drop the biggest preinstalled
          # bundles we never use (~27 GB back).
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /usr/local/.ghcup 2>/dev/null || true
          # Swap headroom: a tier-3 gradle build + emulator peaked past 16 GB
          # and the runner's memory watchdog SIGTERM'd the build at ~81 min
          # (run 30538459202). 8 GB of swap absorbs the spikes — on /mnt (the
          # runner's larger scratch disk), NOT the root disk the build needs.
          SWAPDIR=/mnt; [ -d /mnt ] && sudo test -w /mnt || SWAPDIR=""
          sudo fallocate -l 8G ${SWAPDIR}/swapfile && sudo chmod 600 ${SWAPDIR}/swapfile && sudo mkswap ${SWAPDIR}/swapfile && sudo swapon ${SWAPDIR}/swapfile
          free -m | head -3
          df -h / /mnt 2>/dev/null | tail -2
          # adb/emulator are not on the runner's default PATH.
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$SDK/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/sdkmanager" --install emulator platform-tools "system-images;android-35;google_apis;x86_64" > /tmp/sdkmanager.log 2>&1
          echo "TIMING[sdk-install] $(( $(date +%s) - T0 ))s"
          echo no | "$SDK/avdmanager" create avd -n session -k "system-images;android-35;google_apis;x86_64" -d pixel_7 --force
          # New cmdline-tools write AVDs to ~/.config/.android/avd but the
          # emulator searches $ANDROID_AVD_HOME → ~/.android/avd (spike finding:
          # "Unknown AVD name [session]"). Point both at the real location.
          AVD_HOME="$HOME/.config/.android/avd"
          [ -d "$AVD_HOME" ] || AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          # NOTE: the app heap is raised AFTER boot via setprop (see the
          # "Raise the app heap" step) — config.ini's hw.heapSize/vm.heapSize
          # are ignored by this system image (verified: dalvik.vm.heapgrowthlimit
          # stayed at 192m through an AVD-config edit AND emulator -prop flags).
          ANDROID_AVD_HOME="$AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" -avd session -no-window -gpu swiftshader_indirect \
            -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 > /tmp/emulator.log 2>&1 &
          echo "emulator launched in background (pid $!)"

      - name: Prepare Android build resources for local device
        if: ${{ inputs.device_target == 'local' }}
        run: |
          set -euxo pipefail
          # Preserve the build headroom from the remote path without installing
          # an emulator image, configuring KVM, or starting an AVD.
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /usr/local/.ghcup 2>/dev/null || true
          if [ -d /mnt ] && sudo test -w /mnt; then
            sudo fallocate -l 8G /mnt/ops-native-swapfile
            sudo chmod 600 /mnt/ops-native-swapfile
            sudo mkswap /mnt/ops-native-swapfile
            sudo swapon /mnt/ops-native-swapfile
          fi
          free -m | head -3
          df -h / /mnt 2>/dev/null | tail -2

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Wait for emulator boot
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -uxo pipefail
          echo "TIMING[npm-ci-done] $(( $(date +%s) - T0 ))s"
          # Bounded: a crashed emulator must fail the step, not hang it (the
          # unbounded wait-for-device hid the AVD-path bug in the spike).
          if ! timeout 300 adb wait-for-device; then
            echo "ERROR: adb never saw the emulator"; tail -50 /tmp/emulator.log; exit 1
          fi
          booted=0
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            echo "ERROR: emulator did not finish booting"; tail -50 /tmp/emulator.log; exit 1
          fi
          adb devices
          echo "TIMING[emulator-booted] $(( $(date +%s) - T0 ))s"

      - name: Raise the app heap (dev bundle OOMs on the 192 MB default)
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -uxo pipefail
          # Loading the dev Metro bundle needs a ~140 MB contiguous allocation;
          # the image's 192 MB growth limit OOMs Hermes with
          # "Failed to allocate ... until OOM, target footprint ..., growth
          # limit 201326592" (session 685151be). Only a rooted setprop +
          # zygote restart actually moves it — config.ini and `emulator -prop`
          # are both ignored by this system image.
          adb root > /dev/null 2>&1 || true
          sleep 3
          timeout 60 adb wait-for-device
          # Suppress error dialogs BEFORE the restart: the zygote bounce leaves
          # SystemUI briefly unresponsive and the resulting "System UI isn't
          # responding" ANR dialog would otherwise sit on top of the app in the
          # stream (and only a tap on "Wait" clears it once shown). The setting
          # lives in the settings DB, so it survives the restart.
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell setprop dalvik.vm.heapgrowthlimit 768m
          adb shell setprop dalvik.vm.heapsize 768m
          adb shell stop; sleep 3; adb shell start
          for i in $(seq 1 60); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          echo "heapgrowthlimit now: $(adb shell getprop dalvik.vm.heapgrowthlimit)"
          # The zygote restart leaves SystemUI briefly unresponsive, which pops
          # an "isn't responding" ANR dialog over the app in the stream. Suppress
          # error dialogs outright (headless CI device — nobody reads them) and
          # give the UI time to settle before the app launches.
          sleep 25
          # Defensive: if a dialog slipped through before the setting applied,
          # tap its "Wait" button (KEYCODE_BACK does NOT dismiss ANR dialogs).
          if adb shell dumpsys window 2>/dev/null | grep -qi "aerr"; then
            echo "ANR dialog present — dismissing"
            adb shell input tap 320 1367 || true
          fi

      - name: Wait for driver-provisioned .env (handshake)
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -uxo pipefail
          # The driver uploads the Mac's .env (verbatim — no port rewrite for
          # native sessions) over ssh:2222 then touches /tmp/env-provisioned.
          # Metro's babel env plugin reads .env at bundle time, so wait for it
          # BEFORE starting Metro. Degraded fallback: proceed without .env.
          for i in $(seq 1 60); do
            [ -f /tmp/env-provisioned ] && break
            sleep 5
          done
          if [ -f .env ]; then
            echo "driver-provisioned .env present"
          else
            echo "WARNING: no .env after 5 min — Metro will bundle with repo defaults."
          fi

      - name: Wait for driver-provisioned .env (local-device handshake)
        if: ${{ inputs.device_target == 'local' }}
        run: |
          set -uxo pipefail
          # The driver uploads .env to the checkout and signals this exact
          # session, avoiding cross-talk with another native run on the host.
          for i in $(seq 1 60); do
            [ -f "$OPS_NATIVE_SESSION_DIR/env-provisioned" ] && break
            sleep 5
          done
          if [ -f .env ]; then
            echo "driver-provisioned .env present"
          else
            echo "WARNING: no .env after 5 min; Metro will bundle with repo defaults."
          fi

      - name: Start Metro and warm the bundle
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -euxo pipefail
          nohup npx rock start > /tmp/metro.log 2>&1 &
          adb reverse tcp:8081 tcp:8081
          # Warm Metro's first bundle BEFORE the app launches. Building the
          # ~11k-module dev bundle takes ~35 s, and an app that launches into a
          # cold Metro hits its connect timeout and shows the "Could not connect
          # to development server" RedBox — every session started with one until
          # this step existed. Requesting the bundle blocks until it is built.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://127.0.0.1:8081/status" && break
            sleep 2
          done
          time curl -s -o /dev/null -w "bundle warm: %{http_code}\n" --max-time 900 \
            "http://127.0.0.1:8081/index.bundle?platform=android&dev=true&minify=false" || \
            echo "WARNING: bundle warm failed; the app may show a RedBox until it reloads"

      - name: Start Metro on :8081 for local device
        if: ${{ inputs.device_target == 'local' }}
        run: |
          set -euxo pipefail
          nohup npx rock start --port 8081 > "$OPS_NATIVE_SESSION_DIR/metro.log" 2>&1 &
          echo "$!" > "$OPS_NATIVE_SESSION_DIR/metro.pid"
          metro_up=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:8081/status"; then metro_up=1; break; fi
            sleep 2
          done
          if [ "$metro_up" != "1" ]; then
            echo "ERROR: Metro did not answer on :8081"
            tail -80 "$OPS_NATIVE_SESSION_DIR/metro.log"
            exit 1
          fi
          time curl -s -o /dev/null -w "bundle warm: %{http_code}\n" --max-time 900 \
            "http://127.0.0.1:8081/index.bundle?platform=android&dev=true&minify=false" || \
            echo "WARNING: bundle warm failed; the local app may need to reload"

      - name: Install app (fork cache → Rock/S3 → local build + upload)
        if: ${{ inputs.device_target == 'remote' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uxo pipefail
          FP=$(npx rock fingerprint -p android 2>/dev/null | grep -oE '\b[0-9a-f]{40}\b' | head -1)
          ARTIFACT="rock-android-developmentDebug-${FP}"
          echo "fingerprint=$FP artifact=$ARTIFACT"

          # Tier 1: the fork's rock-cache release.
          if gh release download rock-cache --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT.zip" --dir /tmp/fork-cache 2>/dev/null; then
            echo "fork-cache HIT"
            mkdir -p /tmp/fork-app && unzip -oq "/tmp/fork-cache/$ARTIFACT.zip" -d /tmp/fork-app
            APK=$(find /tmp/fork-app -name '*.apk' | head -1)
            adb install -r "$APK"
            adb shell monkey -p com.expensify.chat.dev -c android.intent.category.LAUNCHER 1
          else
            echo "fork-cache MISS — trying Rock (S3 remote cache, local-build fallback)"
            # Free the emulator's 4 GB during the build — it is only needed at
            # install time, and the gradle+kotlin+clang peak plus an idle
            # emulator is what got the previous build SIGTERM'd.
            adb emu kill || true
            sleep 3
            # Tier 2+3: rock downloads by fingerprint, or BUILDS (no install —
            # the emulator is down; ~45-90 min on this runner). 150-min cap.
            df -h / | tail -1; free -m | head -2
            SENTRY_DISABLE_AUTO_UPLOAD=true GRADLE_OPTS="-Dorg.gradle.workers.max=3" timeout 9000 npx rock build:android \
              --variant developmentDebug --verbose > /tmp/rock-run.log 2>&1
            RC=$?
            df -h / | tail -1; free -m | head -2
            grep -iE "remote cache|download|fingerprint|error" /tmp/rock-run.log | tail -30 || true
            if [ $RC -ne 0 ]; then
              echo "rock build:android failed rc=$RC"
              tail -100 /tmp/rock-run.log
              echo "--- dmesg tail (OOM forensics) ---"; sudo dmesg 2>/dev/null | tail -20 || true
              exit 1
            fi
            APK=$(find android/app/build/outputs -name '*.apk' 2>/dev/null | head -1 || true)
            if [ -z "$APK" ]; then
              APK=$(find .rock/cache -name '*.apk' 2>/dev/null | head -1 || true)
            fi
            if [ -z "$APK" ]; then echo "ERROR: build succeeded but no APK found"; exit 1; fi
            # Tier-1 upload BEFORE anything else can fail: cache it for next time.
            (cd "$(dirname "$APK")" && zip -q "/tmp/$ARTIFACT.zip" "$(basename "$APK")")
            gh release upload rock-cache "/tmp/$ARTIFACT.zip" --repo "$GITHUB_REPOSITORY" --clobber \
              && echo "uploaded $ARTIFACT.zip to fork rock-cache" \
              || echo "WARNING: fork-cache upload failed (session continues)"
            # Bring the emulator back and install/launch (mirrors the HIT path).
            ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" -avd session -no-window -gpu swiftshader_indirect \
              -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 > /tmp/emulator2.log 2>&1 &
            timeout 300 adb wait-for-device
            for i in $(seq 1 90); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
              sleep 5
            done
            adb reverse tcp:8081 tcp:8081
            adb install -r "$APK"
            adb shell monkey -p com.expensify.chat.dev -c android.intent.category.LAUNCHER 1
          fi
          # Cold start takes a few seconds after the launcher intent (monkey
          # returns immediately; a bare pidof 0.3 s later raced it — run
          # 30560900278). Poll up to 60 s, re-firing the intent once midway.
          launched=0
          for i in $(seq 1 12); do
            if adb shell pidof com.expensify.chat.dev > /dev/null 2>&1; then launched=1; break; fi
            if [ "$i" = "6" ]; then adb shell monkey -p com.expensify.chat.dev -c android.intent.category.LAUNCHER 1 || true; fi
            sleep 5
          done
          if [ "$launched" != "1" ]; then echo "app not running"; adb shell pm list packages | grep -i expensify || true; exit 1; fi
          echo "TIMING[app-running] $(( $(date +%s) - T0 ))s"

      - name: Stage Android app for local device (fork cache → Rock/S3 → local build + upload)
        if: ${{ inputs.device_target == 'local' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uxo pipefail
          FP=$(npx rock fingerprint -p android 2>/dev/null | grep -oE '\b[0-9a-f]{40}\b' | head -1)
          if [ -z "$FP" ]; then echo "ERROR: Android Rock fingerprint is empty"; exit 1; fi
          ARTIFACT="rock-android-developmentDebug-${FP}"
          echo "fingerprint=$FP artifact=$ARTIFACT"

          # Keep the exact remote-mode cache key and upload format. On a cache
          # miss, Rock first tries its S3 cache and then builds developmentDebug.
          if gh release download rock-cache --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT.zip" --dir /tmp/fork-cache 2>/dev/null; then
            echo "fork-cache HIT"
            mkdir -p /tmp/fork-app && unzip -oq "/tmp/fork-cache/$ARTIFACT.zip" -d /tmp/fork-app
            APK=$(find /tmp/fork-app -type f -name '*.apk' | head -1 || true)
          else
            echo "fork-cache MISS; trying Rock (S3 remote cache, local-build fallback)"
            df -h / | tail -1; free -m | head -2
            SENTRY_DISABLE_AUTO_UPLOAD=true GRADLE_OPTS="-Dorg.gradle.workers.max=3" timeout 9000 npx rock build:android \
              --variant developmentDebug --verbose > /tmp/rock-run.log 2>&1
            RC=$?
            df -h / | tail -1; free -m | head -2
            grep -iE "remote cache|download|fingerprint|error" /tmp/rock-run.log | tail -30 || true
            if [ $RC -ne 0 ]; then
              echo "rock build:android failed rc=$RC"
              tail -100 /tmp/rock-run.log
              echo "--- dmesg tail (OOM forensics) ---"; sudo dmesg 2>/dev/null | tail -20 || true
              exit 1
            fi
            APK=$(find ".rock/cache/remote-build/$ARTIFACT" -type f -name '*.apk' 2>/dev/null | head -1 || true)
            if [ -z "$APK" ]; then
              APK=$(find android/app/build/outputs -type f -name '*.apk' 2>/dev/null | head -1 || true)
            fi
            if [ -z "$APK" ]; then echo "ERROR: build succeeded but no developmentDebug APK found"; exit 1; fi
            (cd "$(dirname "$APK")" && zip -q "/tmp/$ARTIFACT.zip" "$(basename "$APK")")
            gh release upload rock-cache "/tmp/$ARTIFACT.zip" --repo "$GITHUB_REPOSITORY" --clobber \
              && echo "uploaded $ARTIFACT.zip to fork rock-cache" \
              || echo "WARNING: fork-cache upload failed (session continues)"
          fi

          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "ERROR: no developmentDebug APK resolved"
            exit 1
          fi
          set -e
          cp "$APK" "$OPS_NATIVE_SESSION_DIR/app.apk"
          (cd "$OPS_NATIVE_SESSION_DIR" && sha256sum app.apk > app.apk.sha256)
          test -s "$OPS_NATIVE_SESSION_DIR/app.apk"
          test -s "$OPS_NATIVE_SESSION_DIR/app.apk.sha256"
          # Ready means both deliverables are complete and Metro is still live.
          curl -sf -o /dev/null "http://127.0.0.1:8081/status" || { echo "ERROR: Metro is not ready"; exit 1; }
          touch "$OPS_NATIVE_SESSION_DIR/local-device-ready"
          echo "TIMING[local-device-ready] $(( $(date +%s) - T0 ))s"

      - name: Start ws-scrcpy stream UI
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -euxo pipefail
          # ws-scrcpy's node-pty@0.10.1 native module does not compile against
          # the runner's default Node 26 headers (run 30558996656), and the
          # toolcache's contents are not guaranteed (run 30560385259). Use a
          # hermetic pinned Node 18 (ws-scrcpy's own era) for this step only.
          curl -sfL https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz -o /tmp/node18.tar.xz
          mkdir -p /tmp/node18 && tar -xJf /tmp/node18.tar.xz -C /tmp/node18 --strip-components=1
          export PATH="/tmp/node18/bin:$PATH"
          node -v; npm -v
          git clone https://github.com/NetrisTV/ws-scrcpy.git /tmp/ws-scrcpy
          cd /tmp/ws-scrcpy
          # Pinned for reproducible daily use (master @ 2026-07; update deliberately).
          git checkout 37a169d88905b59bc998ea5f251dd00e813aa17c
          # npm install here has flaked fast (23 s, exit 1, run 30558379141) —
          # retry once with a clean cache and surface the log on failure.
          if ! npm install --no-audit --no-fund > /tmp/ws-scrcpy-install.log 2>&1; then
            echo "npm install failed — first attempt log tail:"; tail -40 /tmp/ws-scrcpy-install.log
            npm cache clean --force > /dev/null 2>&1 || true
            if ! npm install --no-audit --no-fund > /tmp/ws-scrcpy-install.log 2>&1; then
              echo "npm install failed twice — log tail:"; tail -60 /tmp/ws-scrcpy-install.log; exit 1
            fi
          fi
          nohup npm start > /tmp/ws-scrcpy.log 2>&1 &
          up=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000 > /dev/null 2>&1; then up=1; break; fi
            sleep 5
          done
          if [ "$up" != "1" ]; then echo "ws-scrcpy did not come up"; tail -50 /tmp/ws-scrcpy.log; exit 1; fi
          echo "TIMING[stream-ready] $(( $(date +%s) - T0 ))s"
          touch /tmp/stream-ready

      - name: Keep session alive until stop or timeout
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -uxo pipefail
          free -m | head -3
          df -h / | tail -1
          echo "Session live: ws-scrcpy on :8000 (forwarded by the MC driver)."
          while true; do
            if [ -f /tmp/stop-session ]; then echo "stop-session sentinel seen; shutting down."; break; fi
            sleep 15
          done

      - name: Keep local-device session alive until stop or timeout
        if: ${{ inputs.device_target == 'local' }}
        run: |
          set -uxo pipefail
          free -m | head -3
          df -h / | tail -1
          echo "Session live: local Android device artifact staged; Metro on :8081."
          while true; do
            if [ -f "$OPS_NATIVE_SESSION_DIR/stop-session" ]; then echo "stop-session sentinel seen; shutting down."; break; fi
            sleep 15
          done

  ios:
    name: iOS simulator session
    if: ${{ inputs.platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 350
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Timer start
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}

      - name: Prepare local-device session directory
        if: ${{ inputs.device_target == 'local' }}
        env:
          OPS_NATIVE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$OPS_NATIVE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]] || [ "${#OPS_NATIVE_TAG}" -gt 64 ]; then
            echo "ERROR: local-device tag must be 1-64 ASCII letters, digits, underscores, or hyphens"
            exit 1
          fi
          OPS_NATIVE_SESSION_DIR="/tmp/ops-native-${OPS_NATIVE_TAG}"
          mkdir -p "$OPS_NATIVE_SESSION_DIR"
          chmod 700 "$OPS_NATIVE_SESSION_DIR"
          rm -f "$OPS_NATIVE_SESSION_DIR/local-device-ready" "$OPS_NATIVE_SESSION_DIR/stop-session"
          printf 'OPS_NATIVE_SESSION_DIR=%s\n' "$OPS_NATIVE_SESSION_DIR" >> "$GITHUB_ENV"

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-dev-${{ inputs.slug }}
          args: --ssh

      - name: Start OpenSSH on :2222
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ inputs.ssh_pubkey }}" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          sudo ssh-keygen -A || true
          sudo /usr/sbin/sshd -p 2222
          echo "TIMING[sshd] $(( $(date +%s) - T0 ))s"

      - name: Verify Xcode and boot simulator early (boots during npm ci)
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -euxo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "WARNING: $DEVELOPER_DIR missing; available Xcodes:"; ls /Applications | grep -i xcode
            LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$LATEST/Contents/Developer"
          fi
          UDID=$(xcrun simctl list devices available --json | \
            /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; phones=[x for v in d.values() for x in v if x["name"].startswith("iPhone")]; print(phones[0]["udid"] if phones else "")')
          if [ -z "$UDID" ]; then echo "ERROR: no available iPhone simulator"; xcrun simctl list devices; exit 1; fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          echo "TIMING[sim-boot-started] $(( $(date +%s) - T0 ))s"

      - name: Verify Xcode for local-device build
        if: ${{ inputs.device_target == 'local' }}
        run: |
          set -euxo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "WARNING: $DEVELOPER_DIR missing; available Xcodes:"; ls /Applications | grep -i xcode
            LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Wait for simulator boot
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -euxo pipefail
          echo "TIMING[npm-ci-done] $(( $(date +%s) - T0 ))s"
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "TIMING[sim-booted] $(( $(date +%s) - T0 ))s"

      - name: Wait for driver-provisioned .env (handshake)
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -uxo pipefail
          for i in $(seq 1 60); do
            [ -f /tmp/env-provisioned ] && break
            sleep 5
          done
          if [ -f .env ]; then
            echo "driver-provisioned .env present"
          else
            echo "WARNING: no .env after 5 min — Metro will bundle with repo defaults."
          fi

      - name: Wait for driver-provisioned .env (local-device handshake)
        if: ${{ inputs.device_target == 'local' }}
        run: |
          set -uxo pipefail
          for i in $(seq 1 60); do
            [ -f "$OPS_NATIVE_SESSION_DIR/env-provisioned" ] && break
            sleep 5
          done
          if [ -f .env ]; then
            echo "driver-provisioned .env present"
          else
            echo "WARNING: no .env after 5 min; Metro will bundle with repo defaults."
          fi

      - name: Start Metro and warm the bundle
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -euxo pipefail
          nohup npx rock start > /tmp/metro.log 2>&1 &
          echo "metro started"
          # Warm Metro's first bundle BEFORE the app launches. Building the
          # ~11k-module dev bundle takes ~35 s, and an app that launches into a
          # cold Metro hits its connect timeout and shows the "Could not connect
          # to development server" RedBox — every session started with one until
          # this step existed. Requesting the bundle blocks until it is built.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://127.0.0.1:8081/status" && break
            sleep 2
          done
          time curl -s -o /dev/null -w "bundle warm: %{http_code}\n" --max-time 900 \
            "http://127.0.0.1:8081/index.bundle?platform=ios&dev=true&minify=false" || \
            echo "WARNING: bundle warm failed; the app may show a RedBox until it reloads"

      - name: Start Metro on :8081 for local device
        if: ${{ inputs.device_target == 'local' }}
        run: |
          set -euxo pipefail
          nohup npx rock start --port 8081 > "$OPS_NATIVE_SESSION_DIR/metro.log" 2>&1 &
          echo "$!" > "$OPS_NATIVE_SESSION_DIR/metro.pid"
          metro_up=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:8081/status"; then metro_up=1; break; fi
            sleep 2
          done
          if [ "$metro_up" != "1" ]; then
            echo "ERROR: Metro did not answer on :8081"
            tail -80 "$OPS_NATIVE_SESSION_DIR/metro.log"
            exit 1
          fi
          time curl -s -o /dev/null -w "bundle warm: %{http_code}\n" --max-time 900 \
            "http://127.0.0.1:8081/index.bundle?platform=ios&dev=true&minify=false" || \
            echo "WARNING: bundle warm failed; the local app may need to reload"

      - name: Install app (fork cache → Rock/S3 → local build + upload)
        if: ${{ inputs.device_target == 'remote' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uxo pipefail
          FP=$(npx rock fingerprint -p ios 2>/dev/null | grep -oE '\b[0-9a-f]{40}\b' | head -1)
          ARTIFACT="rock-ios-simulator-DebugDevelopment-${FP}"
          echo "fingerprint=$FP artifact=$ARTIFACT"

          # Tier 1: the fork's rock-cache release.
          if gh release download rock-cache --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT.zip" --dir /tmp/fork-cache 2>/dev/null; then
            echo "fork-cache HIT"
            mkdir -p /tmp/fork-app && unzip -oq "/tmp/fork-cache/$ARTIFACT.zip" -d /tmp/fork-app
            APP=$(find /tmp/fork-app -name '*.app' -maxdepth 3 2>/dev/null | head -1 || true)
            xcrun simctl install "$SIM_UDID" "$APP"
            xcrun simctl launch "$SIM_UDID" com.expensify.chat.dev
          else
            echo "fork-cache MISS — trying Rock (S3 remote cache, local-build fallback)"
            # Tier 2+3: rock downloads by fingerprint, or builds locally
            # (~1.5-2.5 h on this 3-core runner). 200-min cap.
            npx rock run:ios --configuration DebugDevelopment --scheme "New Expensify Dev" \
              --device "$SIM_UDID" --verbose > /tmp/rock-run.log 2>&1 &
            RPID=$!
            for i in $(seq 1 2400); do
              kill -0 $RPID 2>/dev/null || break
              sleep 5
            done
            if kill -0 $RPID 2>/dev/null; then
              echo "rock run:ios timed out"; kill $RPID || true; tail -80 /tmp/rock-run.log; exit 1
            fi
            wait $RPID; RC=$?
            grep -iE "remote cache|download|fingerprint|installing|launching|error" /tmp/rock-run.log | tail -30 || true
            if [ $RC -ne 0 ]; then echo "rock run:ios failed rc=$RC"; tail -100 /tmp/rock-run.log; exit 1; fi
            # Tier-1 upload: cache the built simulator .app for next time.
            # NOTE: steps run under `bash -e` and we set pipefail, so a find
            # that matches nothing (exit 1) would kill the step even though the
            # app is already installed and launched. `|| true` on every find.
            APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name 'New Expensify Dev.app' -path '*DebugDevelopment-iphonesimulator*' 2>/dev/null | head -1 || true)
            if [ -z "$APP" ]; then
              APP=$(find .rock/cache -type d -name '*.app' 2>/dev/null | head -1 || true)
            fi
            if [ -n "$APP" ]; then
              (cd "$(dirname "$APP")" && zip -qry "/tmp/$ARTIFACT.zip" "$(basename "$APP")")
              gh release upload rock-cache "/tmp/$ARTIFACT.zip" --repo "$GITHUB_REPOSITORY" --clobber \
                && echo "uploaded $ARTIFACT.zip to fork rock-cache" \
                || echo "WARNING: fork-cache upload failed (session continues)"
            else
              echo "WARNING: no .app found to upload to the fork cache"
            fi
          fi
          xcrun simctl listapps "$SIM_UDID" 2>/dev/null | grep -q com.expensify.chat.dev || { echo "app not installed"; exit 1; }
          echo "TIMING[app-running] $(( $(date +%s) - T0 ))s"

      - name: Stage iOS app for local device (fork cache → Rock/S3 → local build + upload)
        if: ${{ inputs.device_target == 'local' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uxo pipefail
          FP=$(npx rock fingerprint -p ios 2>/dev/null | grep -oE '\b[0-9a-f]{40}\b' | head -1)
          if [ -z "$FP" ]; then echo "ERROR: iOS Rock fingerprint is empty"; exit 1; fi
          ARTIFACT="rock-ios-simulator-DebugDevelopment-${FP}"
          echo "fingerprint=$FP artifact=$ARTIFACT"

          # Use the same simulator DebugDevelopment artifact/cache key as the
          # streamed mode, but resolve/build it without booting a simulator.
          if gh release download rock-cache --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT.zip" --dir /tmp/fork-cache 2>/dev/null; then
            echo "fork-cache HIT"
            mkdir -p /tmp/fork-app && unzip -oq "/tmp/fork-cache/$ARTIFACT.zip" -d /tmp/fork-app
            APP=$(find /tmp/fork-app -maxdepth 3 -type d -name 'New Expensify Dev.app' 2>/dev/null | head -1 || true)
          else
            echo "fork-cache MISS; trying Rock (S3 remote cache, local-build fallback)"
            npx rock build:ios --configuration DebugDevelopment --scheme "New Expensify Dev" \
              --destination simulator --verbose > /tmp/rock-run.log 2>&1 &
            RPID=$!
            for i in $(seq 1 2400); do
              kill -0 $RPID 2>/dev/null || break
              sleep 5
            done
            if kill -0 $RPID 2>/dev/null; then
              echo "rock build:ios timed out"; kill $RPID || true; tail -80 /tmp/rock-run.log; exit 1
            fi
            wait $RPID; RC=$?
            grep -iE "remote cache|download|fingerprint|building|error" /tmp/rock-run.log | tail -30 || true
            if [ $RC -ne 0 ]; then echo "rock build:ios failed rc=$RC"; tail -100 /tmp/rock-run.log; exit 1; fi
            APP=$(find ".rock/cache/remote-build/$ARTIFACT" -maxdepth 2 -type d -name 'New Expensify Dev.app' 2>/dev/null | head -1 || true)
            if [ -z "$APP" ]; then
              APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name 'New Expensify Dev.app' -path '*DebugDevelopment-iphonesimulator*' 2>/dev/null | head -1 || true)
            fi
            if [ -z "$APP" ]; then echo "ERROR: build succeeded but no New Expensify Dev.app found"; exit 1; fi
            (cd "$(dirname "$APP")" && zip -qry "/tmp/$ARTIFACT.zip" "$(basename "$APP")")
            gh release upload rock-cache "/tmp/$ARTIFACT.zip" --repo "$GITHUB_REPOSITORY" --clobber \
              && echo "uploaded $ARTIFACT.zip to fork rock-cache" \
              || echo "WARNING: fork-cache upload failed (session continues)"
          fi

          if [ -z "${APP:-}" ] || [ ! -d "$APP" ]; then
            echo "ERROR: no New Expensify Dev.app resolved"
            exit 1
          fi
          set -e
          # ditto preserves the app-bundle metadata/resource forks expected by
          # macOS/iOS tooling; the operator always receives a stable filename.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OPS_NATIVE_SESSION_DIR/app.zip"
          (cd "$OPS_NATIVE_SESSION_DIR" && shasum -a 256 app.zip > app.zip.sha256)
          test -s "$OPS_NATIVE_SESSION_DIR/app.zip"
          test -s "$OPS_NATIVE_SESSION_DIR/app.zip.sha256"
          curl -sf -o /dev/null "http://127.0.0.1:8081/status" || { echo "ERROR: Metro is not ready"; exit 1; }
          touch "$OPS_NATIVE_SESSION_DIR/local-device-ready"
          echo "TIMING[local-device-ready] $(( $(date +%s) - T0 ))s"

      - name: Start baguette stream UI
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -euxo pipefail
          # Pinned release for reproducible daily use; update deliberately.
          BAGUETTE_URL="https://github.com/tddworks/baguette/releases/download/v0.1.85/baguette_v0.1.85_macOS_arm64.tar.gz"
          if curl -sfL "$BAGUETTE_URL" -o /tmp/baguette.tar.gz; then
            mkdir -p /tmp/baguette && tar -xzf /tmp/baguette.tar.gz -C /tmp/baguette
            # The release binary is named `Baguette` (capital B).
            BAGUETTE=$(find /tmp/baguette -type f -iname baguette | head -1)
            chmod +x "$BAGUETTE"
          else
            echo "pinned release download failed; falling back to brew (slower)"
            brew install baguette
            BAGUETTE=baguette
          fi
          "$BAGUETTE" --version || true
          nohup "$BAGUETTE" serve > /tmp/baguette.log 2>&1 &
          up=0
          for i in $(seq 1 36); do
            if curl -sfL http://127.0.0.1:8421/simulators > /dev/null 2>&1; then up=1; break; fi
            sleep 5
          done
          if [ "$up" != "1" ]; then echo "baguette did not come up"; tail -60 /tmp/baguette.log; exit 1; fi
          echo "TIMING[stream-ready] $(( $(date +%s) - T0 ))s"
          touch /tmp/stream-ready

      - name: Keep session alive until stop or timeout
        if: ${{ inputs.device_target == 'remote' }}
        run: |
          set -uxo pipefail
          vm_stat | head -5
          df -h / | tail -1
          echo "Session live: baguette on :8421 (forwarded by the MC driver)."
          while true; do
            if [ -f /tmp/stop-session ]; then echo "stop-session sentinel seen; shutting down."; break; fi
            sleep 15
          done

      - name: Keep local-device session alive until stop or timeout
        if: ${{ inputs.device_target == 'local' }}
        run: |
          set -uxo pipefail
          vm_stat | head -5
          df -h / | tail -1
          echo "Session live: local iOS device artifact staged; Metro on :8081."
          while true; do
            if [ -f "$OPS_NATIVE_SESSION_DIR/stop-session" ]; then echo "stop-session sentinel seen; shutting down."; break; fi
            sleep 15
          done
