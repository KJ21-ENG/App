name: Seatbelt Fork CI
run-name: ${{ fromJSON(inputs.request).dispatch_tag }}

# This file is installed on the trusted fork default branch by a separately
# approved setup action. It is intentionally dispatch-only: feature branches
# and upstream pull requests never execute this workflow automatically.
on:
  workflow_dispatch:
    inputs:
      request:
        description: "Server-generated bounded JSON identity and allowlisted check request"
        required: true
        type: string

# The runner token is used only by checkout and artifact plumbing. Tested code
# receives no token, repository secret, environment secret, or raw shell input.
permissions:
  contents: read

concurrency:
  # Dispatches are never cancelled implicitly. The server names a successor
  # before it may intentionally cancel an older attempt.
  group: seatbelt-fork-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  checks:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, format, react-compiler, jest]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REQUEST_JSON: ${{ inputs.request }}
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      TRUSTED_WORKFLOW_REF: ${{ github.ref }}
    steps:
      - name: Check out the trusted workflow definition
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Write bounded request envelope
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test "${#REQUEST_JSON}" -le 32768
          printf '%s' "$REQUEST_JSON" > "$RUNNER_TEMP/seatbelt-fork-request.json"
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          const value = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/seatbelt-fork-request.json', 'utf8'));
          if (value === null || typeof value !== 'object' || Array.isArray(value)) throw new Error('request must be an object');
          if (!Number.isInteger(value.schema_version) || value.schema_version !== 1) throw new Error('unsupported request schema');
          if (typeof value.tested_head_sha !== 'string' || !/^[a-fA-F0-9]{40}$/.test(value.tested_head_sha)) throw new Error('tested_head_sha must be a full SHA');
          if (typeof value.base_sha !== 'string' || !/^[a-fA-F0-9]{40}$/.test(value.base_sha)) throw new Error('base_sha must be a full SHA');
          if (typeof value.dispatch_tag !== 'string' || !/^[A-Za-z0-9._:-]{16,160}$/.test(value.dispatch_tag)) throw new Error('dispatch_tag is malformed');
          appendFileSync(process.env.GITHUB_OUTPUT, `tested_sha=${value.tested_head_sha}\n`);
          NODE

      - name: Check out the exact requested tested head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.request.outputs.tested_sha }}
          path: tested-head
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact tested HEAD before any check
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const value = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/seatbelt-fork-request.json", "utf8")); process.stdout.write(value.tested_head_sha);')"
          actual="$(git -C "$GITHUB_WORKSPACE/tested-head" rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Fetch the exact comparison base when required
        if: matrix.check == 'lint' || matrix.check == 'react-compiler'
        shell: bash
        run: |
          set -euo pipefail
          base="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const value = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/seatbelt-fork-request.json", "utf8")); process.stdout.write(value.base_sha);')"
          git -C "$GITHUB_WORKSPACE/tested-head" fetch --no-tags --depth=1 origin "$base"
          git -C "$GITHUB_WORKSPACE/tested-head" cat-file -e "$base^{commit}"

      - name: Normalize the lockfile for the npm cache
        shell: bash
        working-directory: tested-head
        run: jq 'del(.version, .packages[""].version)' package-lock.json > normalized-package-lock.json

      - name: Set up the exact tested Node version
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: tested-head/.nvmrc
          cache: npm
          cache-dependency-path: tested-head/normalized-package-lock.json

      - name: Restore exact tested node_modules
        id: cache-node-modules
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: tested-head/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('tested-head/package-lock.json', 'tested-head/patches/**') }}

      - name: Install exact tested dependencies without credentials
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: bash
        working-directory: tested-head
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          NPM_CONFIG_USERCONFIG: /dev/null
          HOME: ${{ runner.temp }}/seatbelt-fork-install-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          npm ci

      - name: Restore the production-style ESLint cache
        id: restore-eslint
        if: matrix.check == 'lint'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: tested-head/node_modules/.cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('tested-head/eslint.config.mjs', 'tested-head/config/eslint/**', 'tested-head/normalized-package-lock.json') }}-${{ fromJSON(inputs.request).base_sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('tested-head/eslint.config.mjs', 'tested-head/config/eslint/**', 'tested-head/normalized-package-lock.json') }}-
            ${{ runner.os }}-eslint-

      - name: Run one required check
        id: manifest
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node trusted-workflow/ops/fork-actions/run-checks.mjs \
            --input "$RUNNER_TEMP/seatbelt-fork-request.json" \
            --repo "$GITHUB_WORKSPACE/tested-head" \
            --output "$RUNNER_TEMP/seatbelt-fork-check-${{ matrix.check }}.json" \
            --check "${{ matrix.check }}"

      - name: Save successful ESLint cache evidence
        if: matrix.check == 'lint' && steps.manifest.outcome == 'success' && steps.restore-eslint.outputs.cache-hit != 'true'
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: tested-head/node_modules/.cache/eslint
          key: ${{ steps.restore-eslint.outputs.cache-primary-key }}

      - name: Upload bounded per-check result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: seatbelt-fork-check-${{ matrix.check }}-${{ github.run_id }}
          path: ${{ runner.temp }}/seatbelt-fork-check-${{ matrix.check }}.json
          if-no-files-found: error
          retention-days: 7

  summary:
    name: Required-check summary
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUEST_JSON: ${{ inputs.request }}
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      TRUSTED_WORKFLOW_REF: ${{ github.ref }}
    steps:
      - name: Check out the immutable trusted workflow definition
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Write bounded request envelope
        shell: bash
        run: |
          set -euo pipefail
          test "${#REQUEST_JSON}" -le 32768
          printf '%s' "$REQUEST_JSON" > "$RUNNER_TEMP/seatbelt-fork-request.json"
          mkdir -p "$RUNNER_TEMP/seatbelt-fork-results"

      - name: Download all per-check results
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: seatbelt-fork-check-*-${{ github.run_id }}
          path: ${{ runner.temp }}/seatbelt-fork-results
          merge-multiple: true

      - name: Merge parallel results
        id: merge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node trusted-workflow/ops/fork-actions/merge-results.mjs \
            --input "$RUNNER_TEMP/seatbelt-fork-request.json" \
            --results "$RUNNER_TEMP/seatbelt-fork-results" \
            --output "$RUNNER_TEMP/seatbelt-fork-result.json"

      - name: Apply the final required-check gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node trusted-workflow/ops/fork-actions/final-summary.mjs "$RUNNER_TEMP/seatbelt-fork-result.json"

      - name: Upload bounded result manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: seatbelt-fork-result-${{ github.run_id }}
          path: ${{ runner.temp }}/seatbelt-fork-result.json
          if-no-files-found: error
          retention-days: 7
